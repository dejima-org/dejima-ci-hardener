# The static half of the job network's resolver. Install as
# /etc/dnsmasq.d/dejima-ci.conf - see "Where each file goes" in ci/README.md.
#
# There are no `server=` lines here on purpose. Every allowed name is rendered
# into a SECOND file, /etc/dnsmasq.d/ci-allow.conf, by
# refresh-allowlist.example.sh, from .dejima/allowed-domains on origin/main.
# dnsmasq reads both and merges them. Keeping the generated names out of this
# file is what stops a hand-edited copy drifting from the one that is actually
# derived from a branch you control - a `server=` line added here is a grant
# nobody merged.
#
# Same construction as the sandbox's own docker/dns-proxy.sh, one layer out:
# allowlist the names, and let the answers populate the set of allowed
# addresses. A name with no `server=` line anywhere gets REFUSED - not
# resolved and then blocked at the firewall, refused - which is what closes
# off encoding data into query names to a domain you never allowed.
#
# Not runnable as written: the addresses below are RFC 5737 documentation
# ranges. Substitute your own, and read the subnet note in ci/README.md before
# picking one - "private" is load-bearing here, not tidiness.

# Bind the job bridge's gateway only. Never 0.0.0.0: this resolver answers for
# untrusted code and has no business being reachable from anywhere else.
# bind-interfaces (rather than the default bind-dynamic) also keeps it off
# whatever else is listening on this host - systemd-resolved on 127.0.0.53,
# say - instead of contending for :53.
listen-address=203.0.113.1
bind-interfaces
no-hosts

# No system resolvers. Without this, /etc/resolv.conf silently becomes an
# upstream for every name and the allowlist stops meaning anything.
#
# Note this applies to the whole dnsmasq instance, so this instance serves the
# job network and nothing else. If the host needs a resolver for its own sake,
# that is a different instance or a different daemon.
no-resolv

# Every answer served is added to the firewall's set, so a destination that
# rotates its edge addresses stays reachable without a resolver cron chasing
# it. Only allowlisted names get an upstream to answer them in the first
# place, which is what makes a wildcard safe here.
ipset=/#/ci-allow

# Answers claiming a private address are rejected: a name you do not control
# resolving to one is how a job reaches something on your network that was
# never on any list.
#
# This is keyed on the private ranges, which is one of the reasons the job
# bridge itself should use one - see ci/README.md.
stop-dns-rebind

# A self-hosted forge legitimately resolves to a private address, which
# stop-dns-rebind would otherwise reject. Exempt it by name - not by turning
# the protection off. One line per internal name you allow.
rebind-domain-ok=/gitea.example.com/
