# The confined runners: several on one host, sharing one config file and
# therefore one label, so a job naming that label lands on whichever is free.
#
# The privileged runner is NOT here. It has its own compose file, because it
# belongs on its own host - see examples/docker-compose-privileged.yml.
#
# The thing to understand before reading the rest: compose's networks and the
# job network are different worlds. Every service below is an act_runner
# process. The containers that actually execute agent-authored code are
# created by the Docker daemon, on the network named by `container.network` in
# each runner's config.yaml, and compose knows nothing about them. Attaching a
# service here to a network does not put its jobs there, and vice versa. See
# docs/reference.md for what that means for isolating jobs from each other.
#
# Not runnable as written: substitute your own instance URL, image tag and
# subnet, and create the job network first - install.sh does it for you.

name: dejima-runners

# Shared by every confined runner. Volumes are per-service rather than here,
# because each runner needs its own /data - and YAML merge keys merge mappings
# but not lists, so a volumes: in a service replaces this one rather than
# adding to it. Repeating them is the honest form.
x-ci-runner: &ci-runner
  # Pin the tag. These processes execute untrusted code on every pull request,
  # and :latest means the thing doing that can change without you deciding it
  # should.
  image: gitea/act_runner:0.6.1
  restart: unless-stopped
  networks: [runners]

x-ci-env: &ci-env
  # Without this the config file is not read AT ALL - the runner starts
  # happily on built-in defaults, which means the Docker socket goes into
  # every job container and nothing anywhere says so. If you change one thing
  # in a config file and see no effect, check this first.
  CONFIG_FILE: /config.yaml
  GITEA_INSTANCE_URL: https://gitea.example.com
  # Needed only until each runner has registered; the identity then lives in
  # that runner's own /data volume. Comes from a .env file beside this one
  # (chmod 600) so it is not in the file you commit, and is worth deleting
  # once registration succeeds - anyone holding a registration token can
  # register a runner and start receiving jobs, secrets included.
  GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}

services:
  # --- confined runners -----------------------------------------------------
  # All three share one config file, and therefore one label and one job
  # network. That is what makes them a pool: a job naming dejima-ci lands on
  # whichever is free. Only the name and the data volume differ.
  ci-1:
    <<: *ci-runner
    container_name: dejima-ci-1
    environment:
      <<: *ci-env
      GITEA_RUNNER_NAME: dejima-ci-1
    volumes:
      # The runner's OWN access to the daemon, so it can create job
      # containers. NOT the same setting as container.docker_host, which
      # decides whether job containers get the socket - see docs/reference.md.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: a runner has no reason to rewrite the file deciding what
      # its jobs are granted.
      - ./act-runner-confined.yaml:/config.yaml:ro
      # Its registration identity. One per runner, never shared - two runners
      # cannot share a .runner.
      - ci-1-data:/data

  ci-2:
    <<: *ci-runner
    container_name: dejima-ci-2
    environment:
      <<: *ci-env
      GITEA_RUNNER_NAME: dejima-ci-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./act-runner-confined.yaml:/config.yaml:ro
      - ci-2-data:/data

  ci-3:
    <<: *ci-runner
    container_name: dejima-ci-3
    environment:
      <<: *ci-env
      GITEA_RUNNER_NAME: dejima-ci-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./act-runner-confined.yaml:/config.yaml:ro
      - ci-3-data:/data

networks:
  # The runner containers' own network, and nothing else's. They need it only
  # to reach your Gitea instance; they never talk to each other. Sharing one
  # is fine because these are all equally trusted processes - every one of
  # them holds the Docker socket already, so putting them on separate networks
  # would protect nothing.
  #
  # The job network is deliberately absent. It is created by hand with a fixed
  # bridge name so the firewall can match on it (install.sh does this), and
  # act_runner attaches job containers to it by name. Declaring it here would
  # invite attaching a service to it, which is exactly what must not happen: a
  # process holding the Docker socket has no business sharing a network with
  # containers running untrusted code.
  runners:

volumes:
  ci-1-data:
  ci-2-data:
  ci-3-data:
